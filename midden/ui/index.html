<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8" />
<meta name="viewport" content="width=device-width, initial-scale=1" />
<title>Midden</title>
<style>
  :root {
    --bg:#11131a; --panel:#1a1d27; --panel2:#22263340; --line:#2c3142;
    --ink:#e6e9f0; --dim:#8b93a7; --accent:#7aa2f7; --good:#9ece6a;
    --warn:#e0af68; --bad:#f7768e; --keep:#9ece6a;
  }
  * { box-sizing:border-box; }
  body {
    margin:0; font:14px/1.5 ui-monospace,SFMono-Regular,Menlo,Consolas,monospace;
    background:var(--bg); color:var(--ink);
  }
  header {
    display:flex; align-items:center; gap:18px; padding:12px 20px;
    border-bottom:1px solid var(--line); background:var(--panel);
  }
  header h1 { font-size:16px; margin:0; letter-spacing:.5px; }
  header h1 span { color:var(--dim); font-weight:400; }
  nav { display:flex; gap:6px; }
  nav button {
    background:transparent; color:var(--dim); border:1px solid transparent;
    padding:6px 12px; border-radius:6px; cursor:pointer; font:inherit;
  }
  nav button.active { color:var(--ink); background:var(--panel2); border-color:var(--line); }
  .spacer { flex:1; }
  .hint { color:var(--dim); font-size:12px; }
  main { padding:20px; max-width:1000px; margin:0 auto; }
  .view { display:none; }
  .view.active { display:block; }

  /* overview */
  .grid { display:grid; grid-template-columns:repeat(auto-fit,minmax(180px,1fr)); gap:12px; }
  .card { background:var(--panel); border:1px solid var(--line); border-radius:10px; padding:16px; }
  .card .n { font-size:26px; font-weight:600; }
  .card .l { color:var(--dim); font-size:12px; margin-top:4px; }
  .card .n.accent { color:var(--accent); }
  .card .n.good { color:var(--good); }
  .card .n.warn { color:var(--warn); }

  /* review */
  .queue-meta { color:var(--dim); margin-bottom:12px; display:flex; gap:16px; align-items:center; }
  .cluster { background:var(--panel); border:1px solid var(--line); border-radius:10px; padding:16px; }
  .cluster.resolved { opacity:.6; }
  .cluster h2 { margin:0 0 4px; font-size:15px; }
  .cluster .sub { color:var(--dim); font-size:12px; margin-bottom:14px; }
  .paths { display:flex; flex-direction:column; gap:8px; }
  .p {
    display:flex; align-items:center; gap:12px; padding:10px 12px;
    border:1px solid var(--line); border-radius:8px; background:var(--panel2);
    cursor:pointer;
  }
  .p:hover { border-color:var(--accent); }
  .p .idx {
    width:22px; height:22px; flex:none; display:grid; place-items:center;
    border:1px solid var(--line); border-radius:5px; color:var(--dim); font-size:12px;
  }
  .p .path { flex:1; word-break:break-all; }
  .p .drive { color:var(--dim); font-size:11px; }
  .p.kept { border-color:var(--keep); }
  .p.kept .idx { border-color:var(--keep); color:var(--keep); }
  .p.purged { opacity:.45; text-decoration:line-through; }
  .badge { font-size:10px; padding:2px 6px; border-radius:4px; border:1px solid var(--line); color:var(--dim); }
  .badge.keep { color:var(--keep); border-color:var(--keep); }
  .badge.purg { color:var(--bad); border-color:var(--bad); }
  .actions { margin-top:16px; display:flex; gap:8px; flex-wrap:wrap; }
  button.act {
    background:var(--panel2); color:var(--ink); border:1px solid var(--line);
    padding:8px 14px; border-radius:7px; cursor:pointer; font:inherit;
  }
  button.act:hover { border-color:var(--accent); }
  button.act kbd { color:var(--accent); }
  kbd {
    font:inherit; background:#0d0f15; border:1px solid var(--line);
    border-bottom-width:2px; border-radius:4px; padding:0 5px; font-size:11px;
  }
  .empty { color:var(--dim); text-align:center; padding:60px 0; }

  /* search */
  .searchbar { display:flex; gap:10px; margin-bottom:14px; }
  .searchbar input[type=text] {
    flex:1; background:var(--panel); border:1px solid var(--line); color:var(--ink);
    padding:10px 12px; border-radius:8px; font:inherit;
  }
  .searchbar label { color:var(--dim); display:flex; align-items:center; gap:6px; }
  table { width:100%; border-collapse:collapse; }
  th,td { text-align:left; padding:7px 10px; border-bottom:1px solid var(--line); font-size:12px; }
  th { color:var(--dim); font-weight:500; }
  td.path { word-break:break-all; }
  .toast {
    position:fixed; bottom:20px; left:50%; transform:translateX(-50%);
    background:var(--panel); border:1px solid var(--line); padding:10px 16px;
    border-radius:8px; opacity:0; transition:opacity .2s; pointer-events:none;
  }
  .toast.show { opacity:1; }
</style>
</head>
<body>
<header>
  <h1>midden <span>· cluster review</span></h1>
  <nav>
    <button data-view="overview" class="active">Overview</button>
    <button data-view="review">Review</button>
    <button data-view="search">Search</button>
  </nav>
  <div class="spacer"></div>
  <div class="hint" id="globalHint"></div>
</header>

<main>
  <section class="view active" id="view-overview">
    <div class="grid" id="ovGrid"></div>
    <p class="hint" style="margin-top:16px">
      Press <kbd>Review</kbd> (or the tab) to triage the queue. Everything is reversible —
      "purgatory" hides copies from default views but never deletes.
    </p>
  </section>

  <section class="view" id="view-review">
    <div class="queue-meta">
      <span id="qPos">—</span>
      <span class="hint">
        <kbd>J</kbd>/<kbd>K</kbd> next/prev · <kbd>1</kbd>–<kbd>9</kbd> keep that copy ·
        <kbd>P</kbd> purge all · <kbd>X</kbd> skip · <kbd>U</kbd> undo
      </span>
    </div>
    <div id="reviewBody"></div>
  </section>

  <section class="view" id="view-search">
    <div class="searchbar">
      <input type="text" id="q" placeholder="search paths…" autocomplete="off" />
      <label><input type="checkbox" id="incPurg" /> include purgatory</label>
    </div>
    <div id="searchBody"><p class="hint">Type to search across all indexed paths.</p></div>
  </section>
</main>

<div class="toast" id="toast"></div>

<script>
const $ = (s,r=document)=>r.querySelector(s);
const api = async (path, opts) => {
  const r = await fetch(path, opts);
  if (!r.ok) throw new Error((await r.json().catch(()=>({detail:r.statusText}))).detail);
  return r.json();
};
const fmtBytes = b => {
  if (b < 1024) return b + " B";
  const u = ["KB","MB","GB","TB"]; let i=-1;
  do { b/=1024; i++; } while (b>=1024 && i<u.length-1);
  return b.toFixed(1)+" "+u[i];
};
let toastT;
const toast = m => {
  const t=$("#toast"); t.textContent=m; t.classList.add("show");
  clearTimeout(toastT); toastT=setTimeout(()=>t.classList.remove("show"),1600);
};

// ---- view switching ----
let current = "overview";
const showView = v => {
  current = v;
  document.querySelectorAll("nav button").forEach(b=>b.classList.toggle("active",b.dataset.view===v));
  document.querySelectorAll(".view").forEach(s=>s.classList.toggle("active",s.id==="view-"+v));
  if (v==="overview") loadOverview();
  if (v==="review") loadQueue();
  if (v==="search") $("#q").focus();
};
document.querySelectorAll("nav button").forEach(b=>b.onclick=()=>showView(b.dataset.view));

// ---- overview ----
async function loadOverview(){
  const o = await api("/api/overview");
  const cards = [
    ["clusters_unresolved","clusters to review","accent"],
    ["bytes_saveable","reclaimable (dedup)","good", fmtBytes],
    ["bytes_reclaimed","already in purgatory","warn", fmtBytes],
    ["files_unique","unique files",""],
    ["paths_active","active copies",""],
    ["paths_purgatory","purgatoried copies",""],
    ["drives","drives",""],
    ["clusters_resolved","clusters resolved",""],
  ];
  $("#ovGrid").innerHTML = cards.map(([k,l,c,fn])=>`
    <div class="card"><div class="n ${c}">${fn?fn(o[k]):o[k].toLocaleString()}</div>
    <div class="l">${l}</div></div>`).join("");
  $("#globalHint").textContent = `${o.clusters_unresolved} in queue`;
}

// ---- review queue ----
let queue = [], qi = 0, currentCluster = null;
async function loadQueue(){
  const r = await api("/api/clusters?include_resolved=false");
  queue = r.clusters; qi = 0;
  if (!queue.length){ renderEmpty(); return; }
  await renderCluster();
}
function renderEmpty(){
  $("#reviewBody").innerHTML = `<div class="empty">Queue empty — nothing left to review.<br>
    <span class="hint">Resolved clusters are hidden. Press U to undo your last action.</span></div>`;
  $("#qPos").textContent = "0 / 0";
}
async function renderCluster(){
  if (qi<0) qi=0;
  if (qi>=queue.length){ // past end → reload to drop resolved ones
    await loadQueue(); return;
  }
  const meta = queue[qi];
  const c = await api("/api/clusters/"+meta.id);
  currentCluster = c;
  $("#qPos").textContent = `${qi+1} / ${queue.length}`;
  const actives = c.paths.filter(p=>p.status==="active");
  const reclaim = c.size * Math.max(actives.length-1,0);
  const rows = c.paths.map((p,i)=>{
    const activeIdx = p.status==="active" ? actives.indexOf(p)+1 : null;
    const badge = p.status==="purgatory"
      ? `<span class="badge purg">purgatory</span>` : "";
    return `<div class="p ${p.status==='purgatory'?'purged':''}" data-pid="${p.id}" data-keep="${p.status==='active'}">
      <div class="idx">${activeIdx??"·"}</div>
      <div><div class="path">${p.path}</div>
      <div class="drive">drive ${p.drive_id.slice(0,8)}</div></div>
      <div class="spacer" style="flex:1"></div>${badge}</div>`;
  }).join("");
  $("#reviewBody").innerHTML = `
    <div class="cluster ${c.resolved?'resolved':''}">
      <h2>Exact duplicate · ${actives.length} active ${actives.length===1?'copy':'copies'}</h2>
      <div class="sub">${fmtBytes(c.size)} each · ${fmtBytes(reclaim)} reclaimable · ${c.mime||"unknown type"} · ${c.hash.slice(0,16)}…</div>
      <div class="paths">${rows}</div>
      <div class="actions">
        <span class="hint">click a copy or press its number to keep it →</span>
      </div>
    </div>`;
  document.querySelectorAll(".p[data-keep='true']").forEach(el=>{
    el.onclick=()=>keep(parseInt(el.dataset.pid));
  });
}
async function keep(pid){
  if(!currentCluster) return;
  await api(`/api/clusters/${currentCluster.id}/keep`,{method:"POST",
    headers:{"content-type":"application/json"},body:JSON.stringify({path_id:pid})});
  toast("kept 1, rest → purgatory");
  queue.splice(qi,1); await renderCluster(); refreshHint();
}
async function purgeAll(){
  if(!currentCluster) return;
  await api(`/api/clusters/${currentCluster.id}/purge_all`,{method:"POST"});
  toast("all copies → purgatory");
  queue.splice(qi,1); await renderCluster(); refreshHint();
}
function skip(){ qi++; renderCluster(); }
async function undo(){
  try {
    const r = await api("/api/undo",{method:"POST"});
    toast("undid "+r.action);
    await loadQueue();
  } catch(e){ toast(e.message); }
}
async function refreshHint(){
  try{ const o=await api("/api/overview"); $("#globalHint").textContent=`${o.clusters_unresolved} in queue`; }catch{}
}

// ---- search ----
let searchT;
$("#q").addEventListener("input", ()=>{ clearTimeout(searchT); searchT=setTimeout(runSearch,200); });
$("#incPurg").addEventListener("change", runSearch);
async function runSearch(){
  const q=$("#q").value.trim();
  if(!q){ $("#searchBody").innerHTML=`<p class="hint">Type to search across all indexed paths.</p>`; return; }
  const inc=$("#incPurg").checked;
  const r=await api(`/api/search?q=${encodeURIComponent(q)}&include_purgatory=${inc}`);
  if(!r.results.length){ $("#searchBody").innerHTML=`<p class="hint">No matches.</p>`; return; }
  $("#searchBody").innerHTML=`<table><thead><tr>
    <th>path</th><th>drive</th><th>size</th><th>status</th></tr></thead><tbody>${
    r.results.map(x=>`<tr><td class="path">${x.path}</td>
      <td>${x.drive_id.slice(0,8)}</td><td>${fmtBytes(x.size)}</td>
      <td>${x.status==='purgatory'?'<span class="badge purg">purgatory</span>':'active'}</td></tr>`).join("")
  }</tbody></table><p class="hint" style="margin-top:10px">${r.results.length} result(s)</p>`;
}

// ---- keyboard ----
document.addEventListener("keydown", e=>{
  if (e.target.tagName==="INPUT") return;
  if (current!=="review") {
    if (e.key==="r"||e.key==="R") showView("review");
    return;
  }
  const k=e.key.toLowerCase();
  if (k==="j"){ skip(); }
  else if (k==="k"){ qi=Math.max(0,qi-1); renderCluster(); }
  else if (k==="x"){ skip(); }
  else if (k==="p"){ purgeAll(); }
  else if (k==="u"){ undo(); }
  else if (/^[1-9]$/.test(k)){
    const els=document.querySelectorAll(".p[data-keep='true']");
    const el=els[parseInt(k)-1]; if(el) keep(parseInt(el.dataset.pid));
  }
});

loadOverview();
</script>
</body>
</html>
