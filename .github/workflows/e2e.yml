name: e2e

# Runs the synthetic-corpus end-to-end suites — the project's validation method
# (see CLAUDE.md: "Tests via the synthetic corpus"). These exercise ingest,
# clustering, near-dup, purgatory/undo, the FastAPI app, and topic inference
# (stub backend, offline). No external services required.

on:
  push:
    branches: [main, master]
  pull_request:

jobs:
  e2e:
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        python-version: ["3.10", "3.12"]
    steps:
      - uses: actions/checkout@v4

      - name: Set up Python ${{ matrix.python-version }}
        uses: actions/setup-python@v5
        with:
          python-version: ${{ matrix.python-version }}

      - name: Install (web extra + httpx for TestClient)
        # Core ingest/index is stdlib-only; the e2e suites drive the FastAPI app
        # in-process via TestClient, which needs fastapi/uvicorn + httpx. blake3
        # and pillow stay optional — sha256 and no-Pillow paths degrade cleanly.
        run: |
          python -m pip install --upgrade pip
          pip install -e ".[web]" httpx

      - name: Run e2e suites
        run: |
          for t in review near purgatory ingest_ui topics; do
            echo "::group::e2e_$t"
            python tools/e2e_$t.py
            echo "::endgroup::"
          done
